name: OSPS Baseline Scanner

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  osps-assessment:
    runs-on: ubuntu-latest
    name: Baseline Scan

    permissions:
      contents: read # Clone the repository
      id-token: write # Federate with Octo STS for a short-lived GitHub App token
      security-events: write # Required for SARIF upload

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exchanges this workflow's OIDC identity for a short-lived GitHub App
      # token, per the trust policy in .github/chainguard/baseline-scanner.sts.yaml.
      # Replaces the workflow GITHUB_TOKEN, which lacks the administration,
      # checks, and statuses read access some baseline checks need.
      - name: Federate with Octo STS
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: baseline-scanner

      - name: Run Baseline Action
        uses: revanite-io/osps-baseline-action@1af7ff8b44af83f120b20cc5f63b877286849257 # v1.5.2
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          token: ${{ steps.octo-sts.outputs.token }}
          catalog: "osps-baseline"
          upload-sarif: "true"

      - name: Upload Assessment Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osps-assessment-results-${{ github.run_number }}
          path: evaluation_results/
          retention-days: 1
