---
name: CI Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Setup Cue
        uses: cue-lang/setup-cue@v1.0.1

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install editor test dependencies
        run: npm ci

      - name: Test editor
        run: make testeditor

      - name: Validate schema.cue
        run: make lintcue

      - name: Validate example files against schema
        run: make lintyml
