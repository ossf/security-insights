---
name: CI Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/cue2openapi/go.mod
          cache-dependency-path: |
            cmd/cue2openapi/go.sum
            cmd/openapi2md/go.sum

      - name: Test CUE to OpenAPI converter
        working-directory: cmd/cue2openapi
        run: go test -count=1 ./...

      - name: Test OpenAPI to Markdown converter
        working-directory: cmd/openapi2md
        run: go test -count=1 ./...

      - name: Setup Cue
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Install editor test dependencies
        run: npm ci

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      - name: Test editor
        run: make testeditor

      - name: Test editor in browser
        run: npm run test:browser

      - name: Validate schema.cue
        run: make lintcue

      - name: Validate example files against schema
        run: make lintyml
