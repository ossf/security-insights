---
name: CI Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/cue2openapi/go.mod
          cache-dependency-path: |
            cmd/cue2openapi/go.sum
            cmd/openapi2md/go.sum

      - name: Test CUE to OpenAPI converter
        working-directory: cmd/cue2openapi
        run: go test -count=1 ./...

      - name: Test OpenAPI to Markdown converter
        working-directory: cmd/openapi2md
        run: go test -count=1 ./...

      - name: Setup Cue
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Install editor test dependencies
        run: npm ci

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      - name: Test editor
        run: make testeditor

      - name: Test editor in browser
        run: npm run test:browser

      - name: Validate schema.cue
        run: make lintcue

      - name: Validate example files against schema
        run: make lintyml

      - name: Test list constraints in the schema
        run: make testschema
